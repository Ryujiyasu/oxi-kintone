<section class="oxi-config" style="padding:16px 0;max-width:720px">
  <h3 style="margin:0 0 8px">帳票のひな形（Word / Excel）</h3>
  <p style="margin:0 0 12px;color:#555">
    Word や Excel のひな形に <code>{{顧客名}}</code> のように項目名（またはフィールドコード）を書くと、レコードの値に置き換わります。
    明細の行は <code>{{テーブル名.項目名}}</code> と書くと、テーブルの行がその行から下へ順に入ります。
  </p>
  <table class="oxi-templates" style="border-collapse:collapse;margin-bottom:12px;min-width:420px">
    <thead><tr><th style="text-align:left;padding:4px 8px">名前</th><th style="text-align:right;padding:4px 8px">大きさ</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:20px">
    <input type="text" class="oxi-new-name" placeholder="名前（例: 見積書）" style="padding:4px">
    <input type="file" class="oxi-new-file" accept=".docx,.xlsx">
    <button type="button" class="oxi-add">追加</button>
  </div>
  <p style="margin:-8px 0 20px;color:#555">
    お試しには <button type="button" class="oxi-samples">サンプルのひな形を追加</button>
    （見積書・納品書の Word と、請求書の Excel）。サンプルアプリのフィールドに合わせてあります。
  </p>
  <h3 style="margin:0 0 8px">できた PDF の保存先</h3>
  <p style="margin:0 0 8px;color:#555">選ぶと、帳票の画面に「レコードに添付」が出ます。</p>
  <select class="oxi-output" style="padding:4px;margin-bottom:8px"><option value="">保存しない</option></select>
  <p class="oxi-usage" style="color:#555"></p>
  <p class="oxi-error" style="color:#c00"></p>
  <div style="margin-top:20px;display:flex;gap:8px">
    <button type="button" class="oxi-save">保存</button>
    <button type="button" class="oxi-cancel">キャンセル</button>
  </div>
</section>
